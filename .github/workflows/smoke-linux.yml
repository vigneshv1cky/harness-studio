# Reruns the Linux smoke test (desktop/smoke-linux.sh) on the .deb packages from an earlier "Build Linux app" run,
# without rebuilding them, so a release candidate can be checked with the current smoke scripts. Start it from the
# Actions tab with that run's ID.
name: Smoke-test Linux app

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: ID of the "Build Linux app" run whose packages to test
        required: true
      welcome_size:
        description: 'Expected welcome window size, such as 440x400, for packages from an older commit (default: the size the patches set)'
        required: false

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.1
        with:
          name: harness-studio-linux-${{ matrix.arch }}
          path: dist
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Smoke-test the installed .deb
        env:
          HARNESS_STUDIO_WELCOME_SIZE: ${{ inputs.welcome_size }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 x11-utils ./dist/harness-studio_*.deb
          desktop/smoke-linux.sh dist/smoke

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: harness-studio-linux-${{ matrix.arch }}-smoke
          path: dist/smoke
          if-no-files-found: ignore
          retention-days: 30
